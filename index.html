<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Slideshow Gallery</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #111;
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
    }

    .slideshow-container {
      position: relative;
      max-width: 800px;
      width: 100%;
    }

    .slide {
      display: none;
      width: 100%;
    }

    .slide img {
      width: 100%;
      border-radius: 10px;
    }

    .nav-button {
      cursor: pointer;
      position: absolute;
      top: 50%;
      padding: 16px;
      color: white;
      font-size: 24px;
      background-color: rgba(0,0,0,0.5);
      border: none;
      border-radius: 50%;
      transform: translateY(-50%);
      user-select: none;
    }

    .prev {
      left: 10px;
    }

    .next {
      right: 10px;
    }

    .nav-button:hover {
      background-color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>

  <div class="slideshow-container">
    <div class="slide">
      <img src="a.jpg" alt="Slide 1">
    </div>
    <div class="slide">
      <img src="b.jpg" alt="Slide 2">
    </div>
    <div class="slide">
      <img src="c.jpg" alt="Slide 3">
    </div>
    <div class="slide">
        <img src="d.jpg" alt="Slide 4">
      </div>
      <div class="slide">
        <img src="e.jpg" alt="Slide 5">
      </div>
      <div class="slide">
        <img src="f.jpg" alt="Slide 6">
      </div>

    <button class="nav-button prev" onclick="changeSlide(-1)">❮</button>
    <button class="nav-button next" onclick="changeSlide(1)">❯</button>
  </div>

  <script>
    let slideIndex = 0;
    const slides = document.getElementsByClassName("slide");

    function showSlide(index) {
      for (let i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
      }
      slides[index].style.display = "block";
    }

    function changeSlide(direction) {
      slideIndex += direction;
      if (slideIndex >= slides.length) slideIndex = 0;
      if (slideIndex < 0) slideIndex = slides.length - 1;
      showSlide(slideIndex);
    }

    // Initialize first slide
    showSlide(slideIndex);
  </script>

</body>
</html>
